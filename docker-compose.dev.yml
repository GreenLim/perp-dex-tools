# 开发环境配置（热更新代码）
version: '3.8'

services:
  hedge-bot:
    extends:
      file: docker-compose.yml
      service: hedge-bot

    volumes:
      # 开发模式：挂载整个项目目录，支持代码热更新
      - .:/app
      - ./logs:/app/logs
      # 排除 venv（避免本地 venv 覆盖容器内的）
      - /app/venv

    # 开发模式使用交互式终端
    stdin_open: true
    tty: true
